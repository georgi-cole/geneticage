name: Apply report validation corrections

on:
  pull_request:
    paths:
      - '.github/workflows/fix-editorial-validation.yml'

permissions:
  contents: read

jobs:
  fix:
    if: github.repository == 'georgi-cole/geneticage' && github.event.number == 25 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/premium-personal-reports' && github.actor == 'georgi-cole'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Apply exact reviewed changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1881a5fcd2bb760d539da286bb8071c2ef2f0d9b
          python3 - <<'PY'
          from pathlib import Path
          def edit(file,old,new,count=1):
              p=Path(file);s=p.read_text();assert s.count(old)==count,(file,s.count(old),count);p.write_text(s.replace(old,new))
          edit('public/report-editorial.mjs',' const module=',' const addModule=')
          edit('public/report-editorial.mjs',"module('","addModule('",20)
          edit('scripts/report-browser-qa.mjs','data.error?p.reject(Error(JSON.stringify(data.error))):p.resolve(data.result);','if(data.error)p.reject(Error(JSON.stringify(data.error)));else p.resolve(data.result);')
          edit('scripts/build-pages.mjs',"const relativeAssets=text=>text.replaceAll('/assets/','./assets/');",r"export const relativeAssets=text=>text.replace(/(?<![A-Za-z0-9_./:-])\/assets\//g,'./assets/');")
          edit('public/report-pdf.mjs','p.low!==null||p.high!==null','p.low!=null||p.high!=null')
          edit('public/report-pdf.mjs','p.low===null?','p.low==null?')
          edit('public/report-pdf.mjs','p.high===null?','p.high==null?')
          edit('public/report-pdf.mjs','content.push({stack,unbreakable:true,margin:[0,0,0,13]});','content.push({stack,unbreakable:true,margin:[0,0,0,i===e.citations.length-1?0:13]});')
          edit('public/report-pdf.mjs',"[document.modelVersion,e.version,e.knowledgeVersion,e.evidenceVersion,e.layoutVersion].filter(Boolean).join('\\n')","[document.modelVersion,e.version,e.knowledgeVersion,e.evidenceVersion,e.layoutVersion].filter(Boolean).join(' · ')")
          edit('lib/record-encryption.mjs','export const b64 = bytes => btoa(String.fromCharCode(...bytes));',"export function b64(bytes) {\n  // Bounded chunks avoid argument-count limits for long bilingual report snapshots.\n  const chunks = [];\n  for (let offset = 0; offset < bytes.length; offset += 32768) chunks.push(String.fromCharCode(...bytes.subarray(offset, offset + 32768)));\n  return btoa(chunks.join(''));\n}")
          Path('tests/report-asset-paths.test.mjs').write_text('''import assert from 'node:assert/strict';
          import {randomBytes} from 'node:crypto';
          import {b64,seal,unseal} from '../lib/record-encryption.mjs';
          import {test} from 'node:test';
          import {relativeAssets} from '../scripts/build-pages.mjs';
          import {reportFixtures} from '../scripts/report-fixtures.mjs';
          import {reportPdfDefinition} from '../public/report-pdf.mjs';

          test('publication rewrites root assets without corrupting relative PDF imports',()=>{
           assert.equal(relativeAssets('"/assets/mark.png"'), '"./assets/mark.png"');
           assert.equal(relativeAssets('url(/assets/mark.png)'), 'url(./assets/mark.png)');
           for(const value of ['./assets/report-pdf-runtime.js','../assets/mark.png','https://example.test/assets/mark.png','assets/mark.png'])assert.equal(relativeAssets(value),value);
           assert.equal(relativeAssets('new URL("./assets/report-pdf-runtime.js", document.baseURI)'), 'new URL("./assets/report-pdf-runtime.js", document.baseURI)');
          });

          test('technical exports do not invent undefined reference bounds',()=>{
           const fixture=reportFixtures()[0];
           for(const fact of fixture.document.facts){if(fact.provenance){delete fact.provenance.low;delete fact.provenance.high;}}
           const definition=reportPdfDefinition(fixture.document,{scope:'technical'});
           assert.doesNotMatch(JSON.stringify(definition), /undefined/);
          });

          test('large bilingual reports retain the exact authenticated encryption format',async()=>{
           for(const length of [0,32767,32768,32769,200000]){
            const bytes=randomBytes(length);assert.equal(b64(bytes),bytes.toString('base64'));
           }
           const env={ASSESSMENT_ENCRYPTION_KEY:randomBytes(32).toString('base64')};
           const value={text:'Български / English · 6.2 mmol/L. '.repeat(20000)};
           const encrypted=await seal(env,'fictional-owner','report-id','report',value);
           assert.ok(encrypted.startsWith('v1.'));
           assert.deepEqual(await unseal(env,'fictional-owner','report-id','report',encrypted),value);
           for(const [owner,id,kind] of [['other-owner','report-id','report'],['fictional-owner','other-id','report'],['fictional-owner','report-id','assessment']]){
            await assert.rejects(unseal(env,owner,id,kind,encrypted));
           }
          });

          test('the final evidence entry cannot create a blank trailing PDF page',()=>{
           for(const fixture of reportFixtures())for(const scope of ['report','technical']){
            const definition=reportPdfDefinition(fixture.document,{scope});
            assert.equal(definition.content.at(-1).margin[3],0);
           }
          });
          ''')
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit only the reviewed source corrections
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          test "$(git ls-remote origin refs/heads/feat/premium-personal-reports | cut -f1)" = "$EXPECTED_HEAD"
          git add lib/record-encryption.mjs public/report-editorial.mjs public/report-pdf.mjs scripts/build-pages.mjs scripts/report-browser-qa.mjs tests/report-asset-paths.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix PDF asset loading, long encrypted snapshots and export pagination'
          git push origin HEAD:refs/heads/feat/premium-personal-reports
