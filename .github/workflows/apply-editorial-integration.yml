name: Apply approved editorial integration

on:
  pull_request:
    paths:
      - '.github/workflows/apply-editorial-integration.yml'

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'georgi-cole/geneticage' && github.event.number == 25 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/premium-personal-reports' && github.actor == 'georgi-cole'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify and apply the locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e4797b407dac7e1d7fc481595530a4b2f957c0d7
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          root = Path('.integration/editorial-v2')
          paths = [root / f'{i:02}.b64' for i in range(1, 20)]
          encoded = ''.join(path.read_text().strip() for path in paths)
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '73daadb21b2b2eebf0c0b36f70814d24b81becb8adcc77f858cbdc15070679cc'
          patch = lzma.decompress(packed)
          assert len(patch) == 329665
          assert b'diff --git a/.github/' not in patch
          Path('/tmp/editorial-integration.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/editorial-integration.patch
          git apply --index /tmp/editorial-integration.patch
          node scripts/report-locale.mjs
          echo '4948119617fcd0ea770233759bdccacce81afb836b1cc479b4a2811b428a66e5  public/report-knowledge/bg.mjs' | sha256sum -c -
          git add public/report-knowledge/bg.mjs
          git rm -r .integration/editorial-v2
          git diff --cached --check
      - name: Commit only to the existing report feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          actual="$(git ls-remote origin refs/heads/feat/premium-personal-reports | cut -f1)"
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate evidence databank, personalized editorial reports and real PDF delivery'
          git push origin HEAD:refs/heads/feat/premium-personal-reports
