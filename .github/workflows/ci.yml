name: App checks

on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish the static phone preview to GitHub Pages
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify generated copy without changing source
        run: npm run locale:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Check application behavior
        run: npm test
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Build the static phone preview
        run: npm run build:pages
      - name: Package the verified Pages preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-pages

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the verified phone preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
