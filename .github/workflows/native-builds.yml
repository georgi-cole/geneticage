name: Native builds

on:
  pull_request:
    paths:
      - 'native/**'
      - 'public/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/native-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - run: npm ci && npm ci --prefix native
      - run: npm run build:native
      - run: npx --no-install cap sync ios
        working-directory: native
      - name: Compile for iOS
        run: |
          xcodebuild -version
          xcodebuild -project native/ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/geneticage-ios" CODE_SIGNING_ALLOWED=NO build
      - name: Package the unsigned build
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/geneticage-ios/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/GeneticAge-iOS-unsigned.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GeneticAge-iOS-unsigned
          path: ${{ runner.temp }}/GeneticAge-iOS-unsigned.zip
          if-no-files-found: error
