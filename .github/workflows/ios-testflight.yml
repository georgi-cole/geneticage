name: Upload iOS build to TestFlight

on:
  push:
    tags: ['geneticage-ios-*']

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 25
    environment: geneticage-testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - run: npm ci && npm ci --prefix native
      - run: npm run build:native
      - run: npx --no-install cap sync ios
        working-directory: native
      - name: Install the distribution identity and profile
        shell: bash
        env:
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          : "${DISTRIBUTION_P12:?Missing distribution identity}"
          : "${DISTRIBUTION_PASSWORD:?Missing distribution password}"
          : "${APP_STORE_PROFILE:?Missing App Store profile}"
          umask 077
          certificate="$RUNNER_TEMP/geneticage-distribution.p12"
          profile="$RUNNER_TEMP/geneticage.mobileprovision"
          keychain="$RUNNER_TEMP/geneticage-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$DISTRIBUTION_P12" | base64 --decode > "$certificate"
          printf '%s' "$APP_STORE_PROFILE" | base64 --decode > "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$DISTRIBUTION_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution'

          security cms -D -i "$profile" > "$RUNNER_TEMP/geneticage-profile.plist"
          team="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/geneticage-profile.plist")"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/geneticage-profile.plist")"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/geneticage-profile.plist")"
          [[ "$identifier" == "$team.xyz.kolequant.geneticage" ]]
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$profile" "$profiles/$uuid.mobileprovision"
          printf 'GENETICAGE_SIGNING_TEAM=%s\nGENETICAGE_SIGNING_PROFILE=%s\n' "$team" "$uuid" >> "$GITHUB_ENV"
      - name: Archive and export the signed iOS build
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^geneticage-ios-([0-9]+\.[0-9]+(\.[0-9]+)?)-([1-9][0-9]*)$ ]]; then
            echo "Use a release tag such as geneticage-ios-1.0-1." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[3]}"
          archive="$RUNNER_TEMP/GeneticAge.xcarchive"
          xcodebuild -version
          xcodebuild -project native/ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$GENETICAGE_SIGNING_TEAM" PROVISIONING_PROFILE_SPECIFIER="$GENETICAGE_SIGNING_PROFILE" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" archive
          codesign --verify --deep --strict "$archive/Products/Applications/App.app"

          options="$RUNNER_TEMP/GeneticAgeExport.plist"
          cat > "$options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$GENETICAGE_SIGNING_TEAM</string>
            <key>provisioningProfiles</key>
            <dict><key>xyz.kolequant.geneticage</key><string>$GENETICAGE_SIGNING_PROFILE</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/GeneticAgeExport"
          shopt -s nullglob
          packages=("$RUNNER_TEMP/GeneticAgeExport/"*.ipa)
          [[ "${#packages[@]}" -eq 1 ]]
          printf 'GENETICAGE_IPA=%s\n' "${packages[0]}" >> "$GITHUB_ENV"
      - name: Upload the signed build to App Store Connect
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          ASC_UPLOAD_KEY: ${{ secrets.ASC_UPLOAD_KEY_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_UPLOAD_KEY_ID }}
          ASC_ISSUER: ${{ vars.ASC_UPLOAD_ISSUER_ID }}
        run: |
          : "${ASC_UPLOAD_KEY:?Missing App Store Connect upload key}"
          : "${ASC_KEY_ID:?Missing App Store Connect key ID}"
          : "${ASC_ISSUER:?Missing App Store Connect issuer}"
          umask 077
          mkdir -p private_keys
          key="private_keys/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_UPLOAD_KEY" | base64 --decode > "$key"
          xcrun altool --upload-app --type ios --file "$GENETICAGE_IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --output-format json
      - name: Remove the temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/geneticage-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
