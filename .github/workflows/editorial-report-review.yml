name: Editorial report review

on:
  pull_request:
    paths:
      - '.github/workflows/editorial-report-review.yml'
      - 'public/report-*.mjs'
      - 'public/report-*.css'
      - 'public/report-knowledge/**'
      - 'scripts/report-*.mjs'
      - 'tests/report-*.mjs'
      - 'docs/PREMIUM_REPORTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Prepare the pinned PDF engine for integration review
        run: npm install --ignore-scripts --save-exact pdfmake@0.3.14
      - name: Package review inputs (no runtime secrets)
        run: |
          git archive --format=tar --output=/tmp/report-review-source.tar HEAD
          tar -cf /tmp/report-pdf-dependency.tar package.json package-lock.json node_modules/pdfmake/build node_modules/pdfmake/LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: report-review-source
          path: |
            /tmp/report-review-source.tar
            /tmp/report-pdf-dependency.tar
          retention-days: 1
          if-no-files-found: error
