name: Bug report
description: Report an application or development problem.
body:
  - type: markdown
    attributes:
      value: Use fictional inputs. Public issues should not contain health records, contact details, tokens or secrets.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the screen, theme and language when relevant.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Device/browser or OS/Node version
